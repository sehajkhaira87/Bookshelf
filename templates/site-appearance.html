{# Every interpolated CSS value comes from fixed tokens in ui_settings_service. #}
{% if site_appearance is defined %}
<style id="site-appearance">
    :root {
        --site-accent: {{ site_appearance.accent }};
        --site-highlight: {{ site_appearance.highlight }};
        --site-tint: {{ site_appearance.tint }};
        --site-card-radius: {{ site_appearance.card_radius }}px;
        --site-small-radius: {{ site_appearance.small_radius }}px;
        --site-card-gap: {{ site_appearance.card_gap }}px;
        --site-card-padding: {{ site_appearance.card_padding }}px;
    }
    .main-content .dept-card, .main-content .category-card {
        border-radius: var(--site-card-radius) !important;
        padding: var(--site-card-padding) !important;
    }
    .main-content .sem-card { border-radius: var(--site-small-radius) !important; }
    .main-content .dept-squares, .main-content .category-squares { gap: var(--site-card-gap); }
    .main-content .semester-grid { gap: calc(var(--site-card-gap) / 2) !important; }
    .main-content .card-badge { color: var(--site-accent); background: var(--site-tint); }
    .main-content .dept-card.selected, .main-content .sem-card.selected,
    .main-content .category-card.selected { border-color: var(--site-highlight); background: var(--site-tint); }
    .main-content .sem-card.selected .sem-prefix { color: var(--site-accent); }
    .sidebar .nav-item.active, .sidebar .nav-item:hover { color: var(--site-highlight); }
    .site-welcome-banner {
        border: 1px solid var(--site-highlight); border-radius: var(--site-small-radius);
        background: var(--site-tint); color: var(--site-accent); padding: 18px 22px;
        margin-bottom: 24px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere;
    }
    .top-header h1, #instruction-text { overflow-wrap: anywhere; }
    .top-header > div:first-child { min-width: 0; }
    body.dark-mode .main-content .dept-card.selected,
    body.dark-mode .main-content .sem-card.selected,
    body.dark-mode .main-content .category-card.selected { background: #2a2118; }
    @media (max-width: 820px) {
        .sidebar .nav-item.active { background: var(--site-highlight) !important; }
        .main-content .dept-squares, .main-content .category-squares { gap: min(var(--site-card-gap), 16px) !important; }
        .main-content .dept-card, .main-content .category-card { padding: min(var(--site-card-padding), 16px) !important; }
    }
</style>
{% endif %}
