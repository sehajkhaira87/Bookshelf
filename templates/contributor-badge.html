{% macro contributor_badge(badge, extra_class='') -%}
{% if badge == 'trusted' %}
<span class="contributor-badge contributor-badge-trusted {{ extra_class }}" title="Contributor recognised by Bookshelf administrators.">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>
    <span>Trusted</span>
</span>
{% elif badge == 'best_contributor' %}
<span class="contributor-badge contributor-badge-best {{ extra_class }}" title="Recognised by Bookshelf administrators for helpful contributions.">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
    <span>Best Contributor</span>
</span>
{% endif %}
{%- endmacro %}
