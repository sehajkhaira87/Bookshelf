<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contribute - BOOKSHELF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='contribute.css') }}">
</head>
<body>

    <div class="page-wrapper">
       <!-- Top Navigation -->
        <nav class="top-nav">
            <div class="brand">
                <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Bookshelf Logo" class="nav-logo">
            </div>
            
            <a href="{{ url_for('dashboard') }}" class="back-btn">
                <span>←</span> Return to Dashboard
            </a>
        </nav>

        <header class="header-section">
            <div class="page-title">
                <h1>Contribute</h1>
                <p>Upload notes, assignments, and papers to help build the archive.</p>
            </div>
        </header>

        <main class="split-layout">
            
            <aside class="leaderboard-panel">
                <div class="panel-header">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="gold-icon"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
                    <h2>Hall of Fame</h2>
                </div>
                
                <ul class="leaderboard-list">
                    <!-- LATER: We will wrap a Jinja for-loop here to pull real database stats -->
                    
                    
                    <div style="text-align: center; padding: 40px 20px; color: rgba(244, 239, 227, 0.4); font-size: 14px; line-height: 1.6;">
                        The archive is currently empty.<br>
                        <span style="color: #F2C14E; font-family: 'Canela', serif; font-size: 16px;">Be the first to leave your mark.</span>
                    </div>
                </ul>
            </aside>

            <section class="upload-panel">
                
                
                <div class="upload-state" id="state-start">
                    <button class="big-contribute-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>Shelf your Notes</span>
                    </button>
                </div>

                
                <div class="upload-state hidden" id="state-options">
                    <h3 class="step-title">How would you like to add it?</h3>
                    
                    <div class="choice-cards">
                        <!-- Camera Option -->
                        <button class="choice-card" id="btn-camera">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                            <span>Scan with Camera</span>
                        </button>

                        <button class="choice-card" id="btn-upload">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            <span>Upload a File</span>
                        </button>
                    </div>

                    <button class="cancel-btn" id="btn-cancel-options">Cancel</button>
                </div>
                <input type="file" id="native-upload" accept=".pdf, .jpg, .jpeg, .png" class="hidden">
                <input type="file" id="native-camera" accept="image/*" capture="environment" class="hidden">

                <div class="upload-state hidden" id="state-form">
                    <h3 class="step-title">Catalog this Document</h3>
                    
                    <div class="selected-file-box">
                        <svg class="file-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <span id="file-name-display">document.pdf</span>
                        <button id="btn-cancel-file" class="remove-btn">✕</button>
                    </div>

                   
                    <form id="metadata-form" action="{{ url_for('contribute') }}" method="POST" enctype="multipart/form-data">
                        
                        <div class="form-row">
                            <select name="branch" required class="book-input">
                                <option value="" disabled selected>Select Branch...</option>
                                <option value="cse">Computer Science</option>
                                <option value="it">Information Tech</option>
                                <option value="electrical">Electrical</option>
                                <option value="civil">Civil</option>
                                <option value="mechanical">Mechanical</option>
                                <option value="electronics">Electronics</option>
                            </select>

                            <select name="category" required class="book-input">
                                <option value="" disabled selected>Select Category...</option>
                                <option value="mst">MST Papers</option>
                                <option value="notes">Study Notes</option>
                                <option value="assignment">Assignment</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <select name="semester" required class="book-input" style="flex: 0.5;">
                                <option value="" disabled selected>Semester...</option>
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>
                            </select>

                            <input type="text" name="subject" placeholder="Subject Name (e.g., Cyber Security)" required class="book-input" style="flex: 1.5;">
                        </div>

                        <button type="submit" class="submit-btn">Place on the Shelf</button>
                    </form>
                </div>

            </section>
        </main>
    </div>
<script src="{{ url_for('static', filename='contribute.js') }}"></script>
</body>
</html>
