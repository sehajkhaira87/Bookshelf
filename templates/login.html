<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Bookshelf</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <div class="login-wrap">
        <div class="login-container">

            <!-- LEFT: interactive book side -->
            <div class="login-visual" id="loginVisual">
                <div class="login-visual-glow"></div>

                <img src="{{ url_for('static', filename='images/loginpagebook.svg') }}" alt="Open Book" class="login-book">

                <p class="login-visual-quote">"Everything, exactly where it belongs."</p>

                <canvas id="trail-canvas" class="login-trail"></canvas>

                <svg id="loginPencil" class="login-pencil" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                  <g transform="rotate(-45 32 32)">
                    <rect x="26" y="6" width="12" height="34" rx="2" fill="#F2C14E" stroke="#B4862A" stroke-width="1.5"/>
                    <rect x="26" y="40" width="12" height="6" fill="#D8D8D8" stroke="#9A9A9A" stroke-width="1"/>
                    <rect x="26" y="2" width="12" height="6" rx="2" fill="#E8879B" stroke="#B95C71" stroke-width="1.5"/>
                    <polygon points="26,46 38,46 32,56" fill="#E8B978" stroke="#B4862A" stroke-width="1.5" stroke-linejoin="round"/>
                    <polygon points="30,54 34,54 32,60" fill="#3A3A3A"/>
                  </g>
                </svg>
            </div>

            <!-- RIGHT: Google-only sign in -->
            <div class="login-formside">
                <div class="login-form-inner login-form-inner--google">

                    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Bookshelf Logo" class="login-logo">

                    <h1>Welcome back</h1>
                    <p class="login-subtext">Sign in with Google to pick up right where you left off.</p>

                    <button type="button" class="login-google-hero" id="googleSignIn">
                        <span class="login-google-icon">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="">
                        </span>
                        <span class="login-google-label">Continue with Google</span>
                        <span class="login-google-arrow">→</span>
                    </button>

                    <p class="login-trust">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        One click, no new passwords to remember
                    </p>

                    <p class="login-terms">
                        By continuing, you agree to Bookshelf's
                        <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
                    </p>

                </div>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('googleSignIn').addEventListener('click', () => {
            // Replace with your actual Google OAuth trigger
            console.log('Trigger Google sign-in');
        });

        // ===== LEFT SIDE — PENCIL + GOLD TRAIL =====
        (function() {
            const visual = document.getElementById('loginVisual');
            if (!visual) return;

            const canvas = document.getElementById('trail-canvas');
            const ctx = canvas.getContext('2d');
            const pencil = document.getElementById('loginPencil');

            let w, h, mx = -100, my = -100, cx = 0, cy = 0;
            let lastX = null, lastY = null, lastAngle = -45;
            let points = [];
            const MAX_POINTS = 60;
            const HOLD_TIME = 1400;
            const FADE_TIME = 900;

            function resize() {
                const r = visual.getBoundingClientRect();
                w = canvas.width = r.width * window.devicePixelRatio;
                h = canvas.height = r.height * window.devicePixelRatio;
                canvas.style.width = r.width + 'px';
                canvas.style.height = r.height + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            resize();
            new ResizeObserver(resize).observe(visual);

            visual.addEventListener('mousemove', (e) => {
                const r = visual.getBoundingClientRect();
                mx = e.clientX - r.left;
                my = e.clientY - r.top;
                pencil.style.opacity = '1';
            });

            visual.addEventListener('mouseleave', () => {
                mx = -100;
                my = -100;
                pencil.style.opacity = '0';
            });

            function addPoint(x, y) {
                points.push({ x, y, t: performance.now() });
                if (points.length > MAX_POINTS) points.shift();
            }

            function updatePencil(x, y) {
                pencil.style.transform = `translate(${x - 20}px, ${y - 20}px)`;
                if (lastX !== null) {
                    const dx = x - lastX, dy = y - lastY;
                    if (Math.hypot(dx, dy) > 1) lastAngle = Math.atan2(dy, dx) * 180 / Math.PI;
                }
                pencil.querySelector('g').setAttribute('transform', `rotate(${lastAngle + 45} 32 32)`);
                lastX = x; lastY = y;
            }

            function draw() {
                const now = performance.now();
                const cssW = canvas.clientWidth;
                const cssH = canvas.clientHeight;
                ctx.clearRect(0, 0, cssW, cssH);

                if (mx >= 0) {
                    cx += (mx - cx) * 0.18;
                    cy += (my - cy) * 0.18;
                    addPoint(cx, cy);
                    updatePencil(cx, cy);
                }

                const totalLife = HOLD_TIME + FADE_TIME;

                if (points.length >= 2) {
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    for (let i = 1; i < points.length; i++) {
                        const p0 = points[i - 1];
                        const p1 = points[i];
                        const age = now - p1.t;
                        if (age > totalLife) continue;

                        let life;
                        if (age <= HOLD_TIME) {
                            life = 1;
                        } else {
                            life = 1 - ((age - HOLD_TIME) / FADE_TIME);
                        }

                        const opacity = life * 0.55;
                        const width = 0.6 + life * 1.6;

                        ctx.beginPath();
                        ctx.moveTo(p0.x, p0.y);
                        ctx.lineTo(p1.x, p1.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                        ctx.lineWidth = width;
                        ctx.stroke();
                    }
                }

                points = points.filter(p => now - p.t < totalLife);
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>

</body>
</html>
