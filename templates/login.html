<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Bookshelf</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <meta name="view-transition" content="same-origin">
</head>
<body>

    <div class="login-wrap">
        <div class="login-container">

            <!-- LEFT: interactive book side -->
            <div class="login-visual" id="loginVisual">
                <div class="login-visual-glow"></div>

                

                <img src="{{ url_for('static', filename='images/loginpagebook.svg') }}" alt="Open Book" class="login-book">

                <p class="login-visual-quote">"Everything, exactly where it belongs."</p>

                <canvas id="trail-canvas" class="login-trail"></canvas>

                <svg id="loginPencil" class="login-pencil" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                  <g transform="rotate(-45 32 32)">
                    <rect x="26" y="6" width="12" height="34" rx="2" fill="#F2C14E" stroke="#B4862A" stroke-width="1.5"/>
                    <rect x="26" y="40" width="12" height="6" fill="#D8D8D8" stroke="#9A9A9A" stroke-width="1"/>
                    <rect x="26" y="2" width="12" height="6" rx="2" fill="#E8879B" stroke="#B95C71" stroke-width="1.5"/>
                    <polygon points="26,46 38,46 32,56" fill="#E8B978" stroke="#B4862A" stroke-width="1.5" stroke-linejoin="round"/>
                    <polygon points="30,54 34,54 32,60" fill="#3A3A3A"/>
                  </g>
                </svg>
            </div>

            <!-- RIGHT: form side -->
            <div class="login-formside">
                <div class="login-form-inner">

                    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Bookshelf Logo" class="login-logo">

                    <h1>Welcome back</h1>
                    <p class="login-subtext">Log in to pick up right where you left off.</p>

                    <form class="login-form" id="loginForm">
                        <div class="login-field">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="you@example.com" required>
                        </div>

                        <div class="login-field">
                            <label for="password">Password</label>
                            <div class="password-wrap">
                                <input type="password" id="password" placeholder="••••••••" required>
                                <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="login-row">
                            <label class="login-remember">
                                <input type="checkbox"> Remember me
                            </label>
                            <a href="#" class="login-forgot">Forgot password?</a>
                        </div>

                        <button type="submit" class="login-submit" id="loginSubmit">
                            <span>Log In</span>
                            <div class="btn-spinner"></div>
                        </button>

                        <div class="login-divider"><span>or</span></div>

                        <button type="button" class="login-google">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                            Continue with Google
                        </button>
                    </form>

                    <p class="login-signup">Don't have an account? <a href="#">Sign up</a></p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.style.display = isPassword ? 'none' : 'block';
            eyeOffIcon.style.display = isPassword ? 'block' : 'none';
            toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });

        // Loading state on submit
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('loginSubmit');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            submitBtn.classList.add('loading');
            setTimeout(() => {
                submitBtn.classList.remove('loading');
            }, 2000);
        });

        // ===== LEFT SIDE — PENCIL + GOLD TRAIL =====
        (function() {
            const visual = document.getElementById('loginVisual');
            if (!visual) return;

            const canvas = document.getElementById('trail-canvas');
            const ctx = canvas.getContext('2d');
            const pencil = document.getElementById('loginPencil');

            let w, h, mx = -100, my = -100, cx = 0, cy = 0;
            let lastX = null, lastY = null, lastAngle = -45;
            let points = [];
            const MAX_POINTS = 60;
            const LIFETIME = 700;

            function resize() {
                const r = visual.getBoundingClientRect();
                w = canvas.width = r.width * window.devicePixelRatio;
                h = canvas.height = r.height * window.devicePixelRatio;
                canvas.style.width = r.width + 'px';
                canvas.style.height = r.height + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            resize();
            new ResizeObserver(resize).observe(visual);

            visual.addEventListener('mousemove', (e) => {
                const r = visual.getBoundingClientRect();
                mx = e.clientX - r.left;
                my = e.clientY - r.top;
                pencil.style.opacity = '1';
            });

            visual.addEventListener('mouseleave', () => {
                mx = -100;
                my = -100;
                pencil.style.opacity = '0';
            });

            function addPoint(x, y) {
                points.push({ x, y, t: performance.now() });
                if (points.length > MAX_POINTS) points.shift();
            }

            function updatePencil(x, y) {
                pencil.style.transform = `translate(${x - 20}px, ${y - 20}px)`;
                if (lastX !== null) {
                    const dx = x - lastX, dy = y - lastY;
                    if (Math.hypot(dx, dy) > 1) lastAngle = Math.atan2(dy, dx) * 180 / Math.PI;
                }
                pencil.querySelector('g').setAttribute('transform', `rotate(${lastAngle + 45} 32 32)`);
                lastX = x; lastY = y;
            }

            function draw() {
                const now = performance.now();
                const cssW = canvas.clientWidth;
                const cssH = canvas.clientHeight;
                ctx.clearRect(0, 0, cssW, cssH);

                if (mx >= 0) {
                    cx += (mx - cx) * 0.18;
                    cy += (my - cy) * 0.18;
                    addPoint(cx, cy);
                    updatePencil(cx, cy);
                }

                if (points.length >= 2) {
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    for (let i = 1; i < points.length; i++) {
                        const p0 = points[i - 1];
                        const p1 = points[i];
                        const age = now - p1.t;
                        if (age > LIFETIME) continue;

                        const life = 1 - (age / LIFETIME);
                        const opacity = life * 0.55;
                        const width = 0.6 + life * 1.6;

                        ctx.beginPath();
                        ctx.moveTo(p0.x, p0.y);
                        ctx.lineTo(p1.x, p1.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                        ctx.lineWidth = width;
                        ctx.stroke();
                    }
                }

                points = points.filter(p => now - p.t < LIFETIME);
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>

</body>
</html>
